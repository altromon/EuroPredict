# ==============================================================================
# AI-SDLC: Prometheus Configuration (Live Scraping + Persistent TSDB)
# For offline/post-mortem backfill from OpenMetrics snapshots:
#   docker exec aisdlc-prometheus promtool tsdb create-blocks-from openmetrics /observability/metrics/metrics.prom /prometheus
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "app-runtime"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9464"]
